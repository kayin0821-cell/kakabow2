function pos(i,extra=0){const p=GPX[Math.max(0,Math.min(GPX.length-1,i))];return Cesium.Cartesian3.fromDegrees(p[0],p[1],p[2]+extra)}
function timeLabel(i){const t=GPX[i][3];if(!t)return '--:--';const d=new Date(t);return new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Taipei'}).format(d)}
